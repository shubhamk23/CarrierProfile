name: Security

# Deliberately not path-filtered: a secret can be committed anywhere in the
# repo, not just under backend/ or frontend/. The credential leak this guards
# against was in backend/.env.example, but the next one might not be.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit in a PR, not just the tip.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
