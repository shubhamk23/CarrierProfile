[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider
markers =
    unit: fast unit tests that touch no I/O
    integration: tests that hit the database or filesystem
    postgres: tests that require a real Postgres instance (skipped otherwise)
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:passlib.*
